[package]
name = "qf-pgpe-py"
version.workspace = true
edition = "2021"  # pyo3 0.20 macro expansions are not edition-2024 clean (as in rusty-sundials-py)
license.workspace = true
description = "Python extension (pyo3 + numpy) exposing the qf-pgpe quantum-fluids engine: PGPE stepping, vortex imprint/detection and the registered transport estimators on numpy arrays."

[lib]
name = "qf_pgpe_py"  # the Python module is still `qf_pgpe` (#[pyo3(name)]); a distinct crate name avoids a rustdoc output collision with `qf-pgpe`
crate-type = ["cdylib"]

[dependencies]
qf-engine = { package = "qf-pgpe", path = "../qf-pgpe" }
num-complex = "0.4"

# pyo3 cannot target wasm32; the crate is empty there (see the crate-level cfg in src/lib.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
