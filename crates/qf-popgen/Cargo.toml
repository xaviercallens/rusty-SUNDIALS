[package]
name = "qf-popgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Absorbing birth-death and Wright-Fisher chains as stiff linear ODEs (continuous-time forward Kolmogorov equation) integrated with this repository's CVODE (BDF, analytic Jacobian), plus a fail-closed absorption-probability certificate that compares the CVODE limit with the closed forms whose n-step version is kernel-checked in Lean (AutoevolveAI formal_cert/Programmes/PopGen). Tier X: floating point, never supports a claim."

[dependencies]
cvode = { path = "../cvode" }
nvector = { path = "../nvector" }

[[bin]]
name = "fixation_ode"
path = "src/bin/fixation_ode.rs"
