[package]
name = "qf-pgpe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Projected Gross-Pitaevskii equation (2D, periodic, IF-RK4) on a doubly-periodic grid — a pure-Rust port of SocrateAI-Scientific-QuantumFluids's pgpe.py, matching numpy's FFT conventions exactly."

[features]
# Intra-step threading (rayon): `ComplexField2D::with_threads(t)`. Results are bit-identical for any t; off by default.
parallel = ["dep:rayon"]

[dependencies]
rustfft = "6.4.1"
num-complex = "0.4"
rayon = { workspace = true, optional = true }

[dev-dependencies]
rayon = { workspace = true }
cvode = { path = "../cvode" }
nvector = { path = "../nvector" }
serde_json = "1"
