[package]
name = "qf-yukawa-crystal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Numerical check of planar universal optimality for the 2D Yukawa (screened Coulomb) interaction: overdamped relaxation with this repository's CVODE (BDF, analytic Jacobian), Hessian minimum check, Langevin annealing, triangular-lattice order analysis, and an open- vs closed-disk confinement study."

[dependencies]
cvode = { path = "../cvode" }
nvector = { path = "../nvector" }

[[bin]]
name = "yukawa_crystal"
path = "src/main.rs"
